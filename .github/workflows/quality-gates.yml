# Quality gates — the deterministic, hermetic half of the pipeline.
#
# WHY THIS EXISTS
# Until this file landed, GitHub Actions ran only three narrow jobs
# (architecture guards, nightly F7+F8 multi-tenant readiness, template-seed
# drift). Nothing in CI ran `pnpm lint` or `pnpm typecheck` — and neither is in
# `.husky/pre-push` either, so a lint error or a type error could reach `main`
# with no gate having ever looked at it. With prod live on real members and real
# money, and no second human reviewer (Constitution IX solo-maintainer
# substitute), that hole is the one worth closing first.
#
# It also lets `.husky/pre-push` get its speed back: the ~190-file
# `tests/contract/` run that made every push cost ~4.3 min moved HERE, so the
# hook is back to ~35 s of cheap invariant checks + the architecture guard.
#
# DELIBERATELY DB-FREE. Every gate below is hermetic:
#   - `pnpm lint` / `pnpm typecheck` / `check:*` are static (fs + AST only).
#   - `pnpm test` (tests/unit + tests/contract) needs NO secrets: when
#     `.env.local` is absent, `tests/setup.ts` injects schema-satisfying
#     placeholders (see its TEST_PLACEHOLDERS map). Contract tests mock every
#     boundary; nothing dials Neon, Stripe, Resend or Upstash.
# Integration + e2e stay OUT of this workflow — they need a disposable Neon
# branch (`CI_DATABASE_URL`, F7.1b backlog B10) and a booted app. Integration
# coverage remains the per-module pre-push gate + the nightly readiness jobs.
#
# NOTE: this workflow REPORTS. Whether a red run blocks a merge is a branch
# protection setting the maintainer owns in GitHub — adding this file does not,
# by itself, gate anything.
name: Quality gates

on:
  pull_request:
  push:
    branches: ['main']

# A force-push or a rapid second push supersedes the previous run.
concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint · typecheck · static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No `version:` — pnpm/action-setup reads `packageManager` in
      # package.json (pnpm@10.0.0), so CI can never drift from the lockfile.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # D-033 — ESLint (`--cache-strategy content`) and tsc (`incremental`)
      # both key their caches on file CONTENT, so they survive a fresh
      # checkout. Restore the newest one for this lockfile + lint config; save
      # a new one per commit even when a step fails (the red run is the one
      # that gets fixed and re-pushed).
      - name: Restore ESLint + tsc caches
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.cache/eslint/
            tsconfig.tsbuildinfo
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'eslint.ui-ratchet.mjs', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'eslint.ui-ratchet.mjs', 'tsconfig.json') }}-

      - name: ESLint
        run: pnpm lint

      # `next-env.d.ts` is gitignored (it does not exist in a fresh checkout)
      # and it `import`s `.next/dev/types/routes.d.ts`, so `tsc` has no Next
      # route/global types until the typegen has run. `next typegen` produces
      # exactly those files without a full `next build` (seconds, not minutes).
      - name: Next route typegen (produces next-env.d.ts + .next types)
        run: pnpm exec next typegen

      - name: TypeScript (strict, --noEmit)
        run: pnpm typecheck

      - name: Save ESLint + tsc caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/.cache/eslint/
            tsconfig.tsbuildinfo
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'eslint.ui-ratchet.mjs', 'tsconfig.json') }}-${{ github.sha }}

      - name: i18n key coverage (EN canonical; TH/SV parity)
        run: pnpm check:i18n

      - name: Single-page → single-container invariant
        run: pnpm check:layout

      - name: Zero test.fixme / bare test.skip in e2e + contract
        run: pnpm check:fixme

      - name: Buddhist-Era / date-handling guard
        run: pnpm check:dates

      - name: env.ts schema ↔ .env.example key parity
        run: pnpm check:env-example

      - name: .env.example boots the env.ts schema verbatim
        run: pnpm check:env-boot

      - name: Every staff page declares a literal permission (016 RBAC)
        run: pnpm check:staff-page-guard

      - name: Every staff API route declares a literal permission (016 RBAC)
        run: pnpm check:api-route-guard

      - name: No unmarked role literal on a decision surface (016 RBAC)
        run: pnpm check:authorization-role-reads

      - name: No audit row states a role its actor did not hold (017)
        run: pnpm check:actor-role-truth

      - name: No money email addressed from the frozen buyer snapshot (108)
        run: pnpm check:money-recipient

      - name: Every F8 renewals route names itself in the errorId taxonomy
        run: pnpm check:f8-error-id

      # D-033 — was in pre-push and pnpm check but in no required CI job (only the
      # path-filtered template-seed-drift.yml); 1 s, so it joins the static gates.
      - name: F7.1a template seed matches its source
        run: pnpm check:template-seed

      # Retro 2026-10-29 (spec 138) — Principle II's commit order: a fix:/feat:
      # commit changing application/domain code needs an earlier test: commit for
      # its module. PR-only: a squash merge leaves one commit on main. The
      # checkout is shallow, so fetch the history (trees only, no blobs) first.
      - name: Every logic commit has a RED commit before it
        if: github.event_name == 'pull_request'
        env:
          RED_FIRST_BASE: ${{ github.event.pull_request.base.sha }}
          RED_FIRST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --filter=blob:none --unshallow origin
          git fetch --no-tags --filter=blob:none origin "$RED_FIRST_HEAD"
          pnpm check:red-first

  unit:
    # Sharded because `vitest.config.ts` caps `maxWorkers: '50%'` for
    # determinism (see the starvation trade-off documented there). On a 2-core
    # runner that is a single worker, so the ~1,800-test suite is split across
    # two runners instead of serialised on one.
    name: Unit + contract (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # tests/unit/** + tests/contract/** per vitest.config.ts `include`.
      # No DATABASE_URL / no secrets — tests/setup.ts fills placeholders.
      - name: Vitest (unit + contract)
        run: pnpm vitest run --shard=${{ matrix.shard }}/2 --passWithNoTests

  rbac-contract:
    # Was a FEATURE_RBAC_V2 env matrix while the two legs coexisted; PR 5
    # deleted the flag and the legacy leg, so one run covers the one evaluator.
    name: RBAC contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Vitest (rbac contract)
        # NO --passWithNoTests (016 post-ship review, below-cap): this leg is a
        # REQUIRED check guarding the permission system — with the flag, a
        # directory rename or glob change that empties the run would keep the
        # check green while executing zero tests (the gate-reads-nothing class
        # this repo was already burned by). An empty set must FAIL.
        run: pnpm vitest run tests/contract/rbac/
