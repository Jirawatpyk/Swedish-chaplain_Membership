# T180 (Phase 9 / SC-011) — multi-tenant readiness nightly job.
# Phase 9 / T254 (F8 extension, 2026-05-10) — adds F8 readiness checks.
# PR #24 review-fix — split F7 and F8 into separate jobs so a hang or
# failure in one feature's readiness suite cannot mask the other's
# status (previously a single 15-min-timeout job interleaved both,
# making "F7 passed" indistinguishable from "F8 hung and killed F7's
# remaining steps along with itself").
#
# Runs the JCC-test tenant fixture (T179) on every weekday morning to
# verify F7 + F8 (and future F-stack features) remain data-only
# configurable for new tenants — i.e. onboarding a new chamber requires
# zero code change in `src/modules/**`.
#
# **Stub-Resend mode** (active by default): T179 uses an in-process
# stub `BroadcastsGatewayPort` so this workflow needs no Resend
# credentials. It runs against the project's TypeScript module graph
# only — confirms the audit catalogue + cascade boundary stay
# tenant-agnostic. Live Resend dispatch is exercised by the staging
# promotion pipeline.
#
# **Database requirement (2026-05-22 fix)**: the readiness suites are
# integration tests that need a real Postgres (`tests/integration-setup.ts`
# throws without DATABASE_URL — by design, so the skip is loud). The
# workflow reads it from the `CI_DATABASE_URL` repo secret. To avoid
# exposing the production database to CI, an operator should point
# `CI_DATABASE_URL` at a DISPOSABLE Neon branch (see F7.1b backlog B10).
# When the secret is ABSENT, the DB-dependent steps are skipped and the
# job goes green with a notice — the workflow no longer hard-fails on
# the missing secret (previously red on every commit incl. main since
# 2026-05-11). Once the operator configures the secret, the readiness
# suite runs for real.
#
# **Env drift fix (2026-07-28)**: both jobs used to declare their whole
# env inline. `src/lib/env.ts` kept gaining required keys (F5 Stripe, F7
# broadcasts from-address, Vercel Blob, TENANT_SLUG, …); the inline lists
# never followed. Every run from at least 2026-07-16 onward therefore died
# at BOOT — `Environment validation failed … 14 × Required`, `Tests: no
# tests` — so the tenant-isolation gate reported red nightly while
# executing nothing. The jobs now seed `.env.local` from `.env.example`,
# the one key-list two gates keep honest (`check:env-example` = no key
# missing, `check:env-boot` = the file boots the schema VERBATIM). The
# job-level `env:` below still wins wherever a real value is needed:
# `process.loadEnvFile` does NOT override an already-set variable.
#
# Failure of either job = ship blocker for the next F7.x or F8.x
# amendment of the failing feature only.
name: F7 + F8 Multi-tenant readiness (nightly)

on:
  schedule:
    # 04:00 UTC = 11:00 Bangkok = quiet window
    - cron: '0 4 * * 1-5'
  workflow_dispatch: {}

jobs:
  # Migrations first, once, for both readiness jobs (2026-07-28). Nothing ever
  # migrated the CI branch, so it sat at whatever schema it had when the
  # secret was configured: the first run after the env fix failed with
  # `SQL missing TS values: ["broadcast_membership_suspended_blocked"]` — an
  # enum the TS tuple has and that branch's `audit_event_type` did not. A
  # single serialised job also avoids two parallel `db:migrate` calls racing
  # for the same migration lock, and warms a suspended Neon compute before the
  # test jobs dial in.
  migrate:
    name: Migrate the CI Neon branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      TEST_DB_HOST_BLOCKLIST: ${{ vars.TEST_DB_HOST_BLOCKLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every DB URL is stripped out of the seed. `.env.example` ships real
      # KEYS with fake HOSTS, and `scripts/run-migrations.ts` (line ~55)
      # prefers DATABASE_URL_UNPOOLED / POSTGRES_URL_NON_POOLING over
      # DATABASE_URL — so seeding the file whole made the migrate job dial
      # `host.aws.neon.tech` and die on ENOTFOUND while the real branch URL sat
      # unused in the job env. Removing the URLs leaves the job env as the only
      # source of a connection string, for every consumer.
      - name: Seed .env.local from .env.example (gate-verified key list, DB URLs stripped)
        run: grep -vE '^(DATABASE_URL|DATABASE_URL_UNPOOLED|POSTGRES_URL_NON_POOLING)=' .env.example > .env.local

      # `tests/integration-setup.ts` refuses to run against a blocklisted host,
      # but `scripts/run-migrations.ts` has no such guard — and this job WRITES
      # DDL. Re-assert the guard here so a mis-set CI_DATABASE_URL can never
      # migrate production from CI.
      - name: Refuse to migrate a blocklisted (production) host
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          IFS=',' read -ra BLOCKED <<< "${TEST_DB_HOST_BLOCKLIST}"
          for host in "${BLOCKED[@]}"; do
            trimmed="$(echo "$host" | xargs)"
            [ -z "$trimmed" ] && continue
            case "$DATABASE_URL" in
              *"$trimmed"*)
                echo "::error title=Refusing to migrate::DATABASE_URL matches blocklisted host \"$trimmed\" (TEST_DB_HOST_BLOCKLIST). CI must point at a disposable Neon branch, never production."
                exit 1
                ;;
            esac
          done
          echo "DATABASE_URL host is not blocklisted — proceeding."

      - name: Apply migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm db:migrate

  f7:
    name: F7 broadcasts readiness
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Stub-Resend mode: T179 does not hit a real Resend account, so
      # API key + webhook secret are placeholder strings. They satisfy
      # `src/lib/env.ts` zod schema length minimums without granting
      # any real-world capability.
      RESEND_BROADCASTS_API_KEY: re_synthetic_ci_placeholder_DO_NOT_USE
      RESEND_BROADCASTS_WEBHOOK_SECRET: synthetic-ci-secret-32-chars-padding-padding
      UNSUBSCRIBE_TOKEN_SECRET: synthetic-ci-token-secret-32-chars-padding
      CRON_SECRET: synthetic-ci-cron-secret
      FEATURE_F7_BROADCASTS: 'true'
      # Disposable Neon branch URL (NOT production). Empty when the
      # operator has not yet configured the secret — DB steps skip.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      # Production-safety guard (tests/integration-setup.ts): refuse the suite
      # if CI_DATABASE_URL is ever mis-set to the prod endpoint. Repo variable.
      TEST_DB_HOST_BLOCKLIST: ${{ vars.TEST_DB_HOST_BLOCKLIST }}
    steps:
      - uses: actions/checkout@v4
      # No `version:` — reads `packageManager` (pnpm@10.0.0), so the runner
      # cannot drift from the lockfile the way the env list did.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # See § "Env drift fix" in the header. The job-level `env:` above still
      # overrides anything here that must be real (DATABASE_URL, flags).
      # Every DB URL is stripped out of the seed. `.env.example` ships real
      # KEYS with fake HOSTS, and `scripts/run-migrations.ts` (line ~55)
      # prefers DATABASE_URL_UNPOOLED / POSTGRES_URL_NON_POOLING over
      # DATABASE_URL — so seeding the file whole made the migrate job dial
      # `host.aws.neon.tech` and die on ENOTFOUND while the real branch URL sat
      # unused in the job env. Removing the URLs leaves the job env as the only
      # source of a connection string, for every consumer.
      - name: Seed .env.local from .env.example (gate-verified key list, DB URLs stripped)
        run: grep -vE '^(DATABASE_URL|DATABASE_URL_UNPOOLED|POSTGRES_URL_NON_POOLING)=' .env.example > .env.local

      - name: Notice — CI_DATABASE_URL not configured (DB steps skipped)
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::notice title=F7 readiness skipped::CI_DATABASE_URL secret is not set. The F7 multi-tenant readiness integration suite needs a disposable Neon branch. Configure the CI_DATABASE_URL repo secret to enable it (see F7.1b backlog B10)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run F7 JCC-test fixture (stub-Resend mode)
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm test:integration tests/integration/broadcasts/jcc-test-tenant-fixture.test.ts --reporter=verbose
      - name: Run F7 member-erasure-cascade test
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm test:integration tests/integration/broadcasts/member-erasure-cascade.test.ts --reporter=verbose
      - name: F7 audit catalogue parity check
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm vitest run --config vitest.integration.config.ts tests/integration/broadcasts/audit-event-type-parity.test.ts

      - name: F7 status badge
        if: always()
        run: |
          echo "F7 broadcasts readiness: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  f8:
    name: F8 renewals readiness
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Phase 9 / T254 — F8 env vars for F8 multi-tenant readiness checks.
      # `RENEWAL_LINK_TOKEN_SECRET_PRIMARY` satisfies the zod ≥32-byte min
      # length; `FEATURE_F8_RENEWALS=true` flips the kill-switch so F8
      # paths are exercised. F8 module reuses the F1+F4 transactional
      # `RESEND_API_KEY` — no new key needed for stub mode.
      FEATURE_F8_RENEWALS: 'true'
      RENEWAL_LINK_TOKEN_SECRET_PRIMARY: synthetic-ci-renewal-token-secret-32-chars-padding
      CRON_SECRET: synthetic-ci-cron-secret
      # Disposable Neon branch URL (NOT production). Empty when the
      # operator has not yet configured the secret — DB steps skip.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      # Production-safety guard (tests/integration-setup.ts): refuse the suite
      # if CI_DATABASE_URL is ever mis-set to the prod endpoint. Repo variable.
      TEST_DB_HOST_BLOCKLIST: ${{ vars.TEST_DB_HOST_BLOCKLIST }}
    steps:
      - uses: actions/checkout@v4
      # No `version:` — reads `packageManager` (pnpm@10.0.0), so the runner
      # cannot drift from the lockfile the way the env list did.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # See § "Env drift fix" in the header. The job-level `env:` above still
      # overrides anything here that must be real (DATABASE_URL, flags).
      # Every DB URL is stripped out of the seed. `.env.example` ships real
      # KEYS with fake HOSTS, and `scripts/run-migrations.ts` (line ~55)
      # prefers DATABASE_URL_UNPOOLED / POSTGRES_URL_NON_POOLING over
      # DATABASE_URL — so seeding the file whole made the migrate job dial
      # `host.aws.neon.tech` and die on ENOTFOUND while the real branch URL sat
      # unused in the job env. Removing the URLs leaves the job env as the only
      # source of a connection string, for every consumer.
      - name: Seed .env.local from .env.example (gate-verified key list, DB URLs stripped)
        run: grep -vE '^(DATABASE_URL|DATABASE_URL_UNPOOLED|POSTGRES_URL_NON_POOLING)=' .env.example > .env.local

      - name: Notice — CI_DATABASE_URL not configured (DB steps skipped)
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::notice title=F8 readiness skipped::CI_DATABASE_URL secret is not set. The F8 multi-tenant readiness integration suite needs a disposable Neon branch. Configure the CI_DATABASE_URL repo secret to enable it (see F7.1b backlog B10)." | tee -a "$GITHUB_STEP_SUMMARY"

      # F3↔F8 archival cascade — proves the renewals cascade port wires
      # tenant-agnostically (no hard-coded SweCham slug; runs against a
      # fresh test-tenant).
      - name: Run F8 F3-archival cascade test
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm test:integration tests/integration/renewals/f3-archival-cascade.test.ts --reporter=verbose
      # RBAC defence-in-depth — proves f8_role_violation_blocked audit
      # persistence works against a fresh test-tenant.
      - name: Run F8 RBAC defence-in-depth test
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm test:integration tests/integration/renewals/rbac-defence-in-depth.test.ts --reporter=verbose
      # Kill-switch granular — proves renewal_kill_switch_blocked +
      # cron_bearer_auth_rejected audit catalogue stays tenant-agnostic.
      - name: Run F8 kill-switch granular test
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm test:integration tests/integration/renewals/kill-switch-granular.test.ts --reporter=verbose
      # F8 audit-port catalogue parity check (contract test — no DB, but
      # transitively imports env.ts; runs only when the DB env is present
      # to keep the job's skip-state uniform).
      - name: F8 audit catalogue parity check
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm vitest run tests/contract/renewals-audit-port.contract.test.ts

      - name: F8 status badge
        if: always()
        run: |
          echo "F8 renewals readiness: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
